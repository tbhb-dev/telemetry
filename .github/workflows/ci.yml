---
# Main quality gate. Bazel pins the tools and owns the gates: the hermetic
# checks are cached `bazel test` targets, so `bazel test //...` runs them
# all, and the few that need the network, Git history or the GitHub API run
# as their own steps after it. A final `conclusion` job gives branch
# protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

# A lockfile only binds a version it has already seen: moving a pin in
# mise.toml while leaving mise.lock alone would make mise fetch the new
# version and rewrite the lockfile in place. MISE_LOCKED makes that a hard
# failure instead.
env:
  MISE_LOCKED: "1"

# A pull request's newer push cancels its older run. Every push to main is its
# own group, so a queued run is never replaced by a later merge: each merge
# keeps its run, and its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run the shared scaffold gates on a hosted Linux runner.
  bazel:
    name: bazel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Sets up Bazel and its caches, then fetches the shared gate tools.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@5f66bbd282e07b5ea1b9bbb51464dee92c3cc2c9  # main
        with:
          disk-cache: ${{ github.workflow }}-ubuntu-24.04
          cache-save: ${{ github.event_name != 'pull_request' }}

      # //... covers the @tbhb_rules lint, format, shell and docs tests over
      # the whole tree, the buildifier_test, and the preset.update_test that
      # fails when preset.bazelrc is stale.
      - name: Test
        run: bazelisk test --config=ci //...

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          include-hidden-files: true

  # Repository checks need history, the network and the GitHub API.
  repo:
    name: repo
    permissions:
      contents: read
      pull-requests: read  # Lowest open PR, for the bootstrap size exemption.
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@5f66bbd282e07b5ea1b9bbb51464dee92c3cc2c9  # main
    with:
      runs-on: ubuntu-24.04
      timeout-minutes: 10
      pip-audit-target: ""
      module-dirs: .

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed; the shared action passes only when every
  # needed job's result is exactly "success".
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@5f66bbd282e07b5ea1b9bbb51464dee92c3cc2c9  # main
        with:
          needs: ${{ toJSON(needs) }}

  # The release build, only for a push to main whose `conclusion` passed, and
  # not in a fork. It builds the wheel, installs it in a fresh environment with
  # its pinned dependencies, and runs a smoke test before anything is
  # published. It holds no write access.
  wheel:
    name: wheel
    if: github.event_name == 'push' && github.repository == 'tbhb-dev/telemetry'
    needs: [conclusion]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # uv 0.13.8's Linux x86-64 archive and its sha256, the same pin as
      # tbhb-dev/tools; this repository's mise.lock does not carry uv. Move
      # them together.
      UV_URL: https://github.com/astral-sh/uv/releases/download/0.13.8/uv-x86_64-unknown-linux-gnu.tar.gz
      UV_SHA256: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/uv.tar.gz" "$UV_URL"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/uv"
          tar --extract --gzip --strip-components=1 --directory "$RUNNER_TEMP/uv" --file "$RUNNER_TEMP/uv.tar.gz"
          echo "$RUNNER_TEMP/uv" >>"$GITHUB_PATH"  # zizmor: ignore[github-env]

      # The file name is fixed (version 0, pure Python) so tools can pin it.
      - name: Build the wheel
        run: |
          uv build --wheel --out-dir dist python
          (cd dist && sha256sum tbhb_telemetry-0-py3-none-any.whl >tbhb_telemetry-0-py3-none-any.whl.sha256)

      # Two checks in one process. Port 1 has no listener, so the export fails
      # at once: a failed export must not fail the command or slow it down.
      # Then a local collector must receive exactly one non-empty POST to
      # /v1/traces, so the span was created and an export was attempted. The
      # script exits non-zero on a wrong exit code, a miss or more than two
      # seconds, and `timeout` fails the step if the process hangs.
      # cspell:ignore rfile
      - name: Smoke-test the built wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/tbhb_telemetry-0-py3-none-any.whl
          export XDG_STATE_HOME="$RUNNER_TEMP/smoke-state"
          timeout 30 "$RUNNER_TEMP/smoke/bin/python" -I - <<'PY'
          import os
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          from tbhb_telemetry import command, materialize


          def main():
              materialize()
              return 0


          def run(label):
              start = time.monotonic()
              code = command("smoke", version="0", main=main)
              elapsed = time.monotonic() - start
              print(label, "exit", code, "elapsed", round(elapsed, 3))
              assert code == 0
              assert elapsed < 2


          os.environ["OTEL_EXPORTER_OTLP_ENDPOINT"] = "http://127.0.0.1:1"
          run("closed port")

          posts = []


          class Collector(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  posts.append((self.path, len(body)))
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, *args):
                  pass


          server = HTTPServer(("127.0.0.1", 0), Collector)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          os.environ["OTEL_EXPORTER_OTLP_ENDPOINT"] = "http://127.0.0.1:%d" % server.server_port
          try:
              run("collector")
          finally:
              server.shutdown()
          print("posts", posts)
          assert len(posts) == 1
          assert posts[0][0] == "/v1/traces"
          assert posts[0][1] > 0
          PY

      - name: Keep the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheel
          path: dist/
          if-no-files-found: error

  # The only job with write access: one GitHub release per merge, tagged
  # `sha-<12 hex>`, with the wheel and its sha256 sidecar. Runs for different
  # merges can finish in any order, so no release is marked latest. The release
  # is created as a draft with both files and published last, so a rerun after
  # an interrupted run finds either nothing, a draft to finish, or a published
  # release to verify.
  release:
    name: release
    needs: [wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # Create the release and attach the files.
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheel
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="sha-${SHA:0:12}"
          wheel=tbhb_telemetry-0-py3-none-any.whl
          sidecar="$wheel.sha256"
          # `gh release view` does not reliably see drafts; the list does.
          found=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | {draft, target: .target_commitish, assets: [.assets[].name]}" \
            | jq --slurp '.')
          count=$(jq 'length' <<<"$found")
          if [ "$count" -eq 0 ]; then
            gh release create "$tag" "dist/$wheel" "dist/$sidecar" --draft --target "$SHA" --latest=false \
              --title "$tag" --notes "Merge of $SHA on main."
            gh release edit "$tag" --draft=false --latest=false
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::found $count releases for $tag"
            exit 1
          fi
          target=$(jq --raw-output '.[0].target' <<<"$found")
          if [ "$target" != "$SHA" ]; then
            echo "::error::release $tag targets $target, not $SHA"
            exit 1
          fi
          draft=$(jq '.[0].draft' <<<"$found")
          if [ "$draft" = true ]; then
            echo "release $tag is an unpublished draft: finishing it"
            gh release upload "$tag" "dist/$wheel" "dist/$sidecar" --clobber
            gh release edit "$tag" --draft=false --latest=false
            exit 0
          fi
          if ! commit=$(gh api "repos/$GH_REPO/commits/tags/$tag" --jq '.sha'); then
            echo "::error::could not resolve published tag $tag to a commit"
            exit 1
          fi
          if [ "$commit" != "$SHA" ]; then
            echo "::error::published tag $tag points to $commit, expected $SHA"
            exit 1
          fi
          for name in "$wheel" "$sidecar"; do
            if ! jq --exit-status --arg name "$name" '.[0].assets | index($name)' <<<"$found" >/dev/null; then
              echo "::error::published release $tag has no asset $name"
              exit 1
            fi
          done
          published=$(mktemp -d)
          gh release download "$tag" --pattern "$wheel" --pattern "$sidecar" --dir "$published"
          published_sum=$(cd "$published" && sha256sum "$wheel")
          sidecar_sum=$(cat "$published/$sidecar")
          if [ "$published_sum" != "$sidecar_sum" ]; then
            echo "::error::published wheel $wheel does not match its SHA-256 sidecar"
            exit 1
          fi
          local_sum=$(cd dist && sha256sum "$wheel")
          if [ "$published_sum" != "$local_sum" ]; then
            echo "::error::published wheel $wheel does not match the SHA-256 of this run's wheel"
            exit 1
          fi
          echo "release $tag is published, points to $SHA and matches this run's wheel"
